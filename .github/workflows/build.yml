name: Build

# Fully automatic releases:
# - Push to main with a new version in package.json: build every platform, tag the
#   version, and publish a GitHub Release with that version's notes from CHANGELOG.md.
# - Push a version tag yourself (v1.2.0): same, using the tag.
# - Run from the Actions tab: just build (files attached to the run).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Is this a new version?
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push ]] && ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Draft the release with notes from CHANGELOG.md
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "NTS Player $VERSION" > notes.md
          gh release view "v$VERSION" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --draft --title "NTS Player $VERSION" --notes-file notes.md --target "$GITHUB_SHA"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        shell: bash
        # macOS runners sometimes fail to unmount the disk image ("hdiutil detach"); retry once
        run: |
          MODE=${{ needs.prepare.outputs.release == 'true' && 'always' || 'never' }}
          npx electron-builder --publish $MODE || { echo "Build failed, retrying once"; sleep 20; npx electron-builder --publish $MODE; }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # unsigned builds
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: NTS-Player-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release (this creates the tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
