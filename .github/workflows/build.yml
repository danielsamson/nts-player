name: Build

# Run from the Actions tab, or by pushing a version tag (e.g. v1.0.0).
# Builds Windows, macOS and Linux versions and attaches them to the run.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Publishing a version tag puts the builds on a GitHub Release, which is where
# the app's automatic updates come from.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        # on a version tag: build and publish to a GitHub Release (draft); otherwise just build
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # unsigned builds
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: NTS-Player-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
