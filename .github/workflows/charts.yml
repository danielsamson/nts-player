name: Charts

# Works out "Most played on NTS" once a day, so the app doesn't have to: the last 30 days,
# this month, and (while any are missing) one older year per run. The JSON files go to the
# `data` branch, which the app downloads from. Run it from the Actions tab with specific
# periods (e.g. "2019-01..2019-12") to rebuild them.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      periods:
        description: 'Periods to build (default: auto backfill years)'
        required: false
        default: 'auto backfill years'

permissions:
  contents: write

concurrency:
  group: charts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check out the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git worktree add data origin/data
          else
            git worktree add --detach data
            (cd data && git checkout --orphan data && git rm -rqf . && rm -rf ./*)
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: node scripts/build-charts.js --out data ${{ github.event.inputs.periods || 'auto backfill years' }}
      - name: Publish
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Charts: $(date -u +%Y-%m-%d)"
          git push origin HEAD:data
