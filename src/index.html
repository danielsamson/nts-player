<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data:; media-src https:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' https://w.soundcloud.com; frame-src https://w.soundcloud.com">
  <title>NTS Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- One header row: logo + channel switcher -->
  <header class="header">
    <button class="logo-button" id="homeBtn" title="Home" aria-label="Home"><img class="logo" src="nts-logo.svg" alt="NTS"></button>
    <nav class="tabs">
      <button class="tab" data-ch="0">
        <span class="channel-icon">1</span><span class="live-dot"></span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="tab__title" id="tabTitle0"></span>
      </button>
      <button class="tab" data-ch="1">
        <span class="channel-icon">2</span><span class="live-dot"></span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="tab__title" id="tabTitle1"></span>
      </button>
    </nav>
    <button class="tab tab--archive" id="archiveTab" title="Archive" aria-label="Archive">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h4v16H3zM9 4h4v16H9zM15.2 4.6l3.9-1 4 15.5-3.9 1z"/></svg>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <button class="tab tab--settings" id="settingsBtn" title="Settings" aria-label="Settings" aria-haspopup="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
    <button class="tab tab--expand" id="expandBtn" title="Wide view" aria-label="Wide view">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="expandIcon" d="M4 4h6v2H7.4l4.3 4.3-1.4 1.4L6 7.4V10H4zm16 16h-6v-2h2.6l-4.3-4.3 1.4-1.4 4.3 4.3V14h2z"/></svg>
    </button>
  </header>

  <main class="channel" id="channel">
    <div class="picture-wrap">
      <div class="picture">
        <img id="art" alt="">
        <span class="picture__meta"><span id="location"></span><span id="time"></span></span>
      </div>
    </div>
    <div class="channel__details">
      <h1 class="broadcast-heading" id="title">Loading…</h1>
      <div class="tags" id="tags"></div>
      <div class="switch" role="tablist">
        <button class="switch__item active" data-pane="about" role="tab">About</button>
        <button class="switch__item" data-pane="tracks" role="tab">Tracklist</button>
      </div>
      <div class="pane" id="pane-about">
        <p class="broadcast-description" id="description"></p>
        <div id="liveMyNts"></div>
        <a class="text-link" id="episodeLink" target="_blank" hidden>View on nts.live</a>
      </div>
      <div class="pane" id="pane-tracks" hidden>
        <div class="supporter" id="supporterBar">
          <span class="supporter__label" id="supporterLabel">NTS Supporter?</span>
        </div>
        <webview id="liveTracks" class="live-tracks" partition="persist:nts" hidden></webview>
        <!-- Our own live tracklist (Supporters), from NTS's live track IDs -->
        <div id="liveList" class="live-list" hidden>
          <p class="tracks__note" id="liveNote"></p>
          <ol class="tracks archive-tracks" id="liveTracksList"></ol>
        </div>
        <div id="episodeTracks">
          <p class="tracks__note" id="tracksNote"></p>
          <ol class="tracks" id="tracks"></ol>
        </div>
      </div>
    </div>
  </main>

  <section class="archive" id="archive" hidden>
    <div class="archive__search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
      <input id="archiveSearch" type="search" placeholder="Search the archive" autocomplete="off" spellcheck="false">
    </div>
    <div class="archive__content" id="archiveContent"></div>
  </section>

  <!-- Wide view: the stage. Big album art and the full track details -->
  <aside class="stage" id="stage" aria-label="Now playing">
    <div class="stage__save" id="stageSave"></div>
    <div class="stage__body">
      <div class="stage__art" id="stageArt">
        <div class="stage__tilt" id="stageTilt">
          <div class="stage__record" aria-hidden="true"><span class="stage__record-label" id="stageRecordLabel"></span></div>
          <div class="stage__cover">
            <img id="stageArtImg" alt="">
            <!-- No cover found: a plain sleeve with a white label showing through the centre hole -->
            <div class="stage__whitelabel" aria-hidden="true">
              <span class="stage__wl-label"><span class="stage__wl-artist" id="wlArtist"></span><span class="stage__wl-title" id="wlTitle"></span></span>
            </div>
            <span class="stage__wear"></span><span class="stage__shine"></span>
          </div>
          <span class="stage__edge stage__edge--right" aria-hidden="true"></span>
          <span class="stage__edge stage__edge--bottom" aria-hidden="true"></span>
        </div>
      </div>
      <div class="stage__info" id="stageInfo">
        <p class="stage__eyebrow">
          <span class="stage__label" id="stageLabel">Now playing</span>
          <span class="stage__context" id="stageContext"></span>
        </p>
        <p class="stage__kicker" id="stageKicker"></p>
        <h2 class="stage__title" id="stageTitle"></h2>
        <p class="stage__artist" id="stageArtist"></p>
        <p class="stage__album" id="stageAlbum"></p>
        <p class="stage__next" id="stageNext"></p>
        <nav class="stage__links" aria-label="Find this track elsewhere">
          <span class="stage__links-label" id="stageLinksLabel">Find it on</span>
          <span class="stage__links-list" id="stageLinks"></span>
        </nav>
      </div>
    </div>
  </aside>

  <!-- Settings: sleep timer, mini player, tray, start at login -->
  <div class="settings" id="settings" hidden role="dialog" aria-label="Settings">
    <div class="settings__row">
      <span class="settings__label">Sleep timer</span>
      <div class="settings__choices" id="sleepChoices">
        <button data-sleep="off">Off</button><button data-sleep="15">15m</button><button data-sleep="30">30m</button>
        <button data-sleep="60">1h</button><button data-sleep="episode">End of episode</button>
      </div>
      <span class="settings__hint" id="sleepHint"></span>
    </div>
    <div class="settings__row settings__account">
      <span class="settings__label">NTS account</span>
      <span class="settings__hint" id="accountHint"></span>
      <button class="mynts-btn" id="signIn">Sign in</button>
      <button class="mynts-btn" id="signOut" hidden>Sign out</button>
    </div>
    <button class="settings__item" id="miniBtn">Mini player</button>
    <button class="settings__item notify-toggle" id="trayToggle">Keep playing when the window is closed</button>
    <button class="settings__item notify-toggle" id="loginToggle">Start NTS Player when I log in</button>
    <p class="settings__keys" id="shortcutHelp"></p>
  </div>

  <div class="snackbar" id="snackbar" hidden>Track info copied</div>

  <!-- Now-playing bar: what you hear, what's next, volume -->
  <footer class="nowbar">
    <div class="seek" id="seek" title="Seek"><div class="seek__fill" id="seekFill"></div></div>
    <button id="play" class="play" aria-label="Play">
      <svg id="iconPlay" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" hidden><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>
    </button>
    <button id="prevTrack" class="skip" aria-label="Previous track" title="Previous track" hidden>
      <svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg>
    </button>
    <button id="nextTrack" class="skip" aria-label="Next track" title="Next track" hidden>
      <svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM4 5l10.5 7L4 19z"/></svg>
    </button>
    <div class="nowbar__art" id="nowArt" hidden><img id="nowArtImg" alt=""></div>
    <div class="nowbar__text">
      <span class="nowbar__now"><span class="nowbar__kind" id="nowKind"></span><span id="nowLabel">Play NTS 1</span></span>
      <span class="nowbar__next" id="next"></span>
    </div>
    <button class="mini-exit" id="miniExit" title="Full player" aria-label="Full player">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H7.4l4.3 4.3-1.4 1.4L6 7.4V10H4zm16 16h-6v-2h2.6l-4.3-4.3 1.4-1.4 4.3 4.3V14h2z"/></svg>
    </button>
    <div class="volume">
      <button class="volume__button" id="mute" aria-label="Mute">
        <svg viewBox="0 0 24 24"><path id="volIcon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      </button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
  </footer>

  <audio id="audio" preload="none"></audio>
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script src="archive-player.js"></script>
  <script src="renderer.js"></script>
  <script src="archive.js"></script>
</body>
</html>
